        <center><h1>Donation Request Form</h1></center>
        <div class="form-group">
            <label for="charitySelect">Donation To:</label>
            <select id="charitySelect" style="width: 100%">
                <option value="">-- Select a Charity --</option>
                <!-- Charity options will be populated dynamically -->
            </select>
        </div>
        <div class="form-group">
            <br>
            <label for="amountRequested">Amount Requested:</label>
            <input id="amountRequested" placeholder="Enter amount in USD" style="width: 25%;" type="number"/>
            </br>
        </div>
        <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
        <script>
            $(document).ready(function() {
                $.ajax({
                    url: 'https://raw.githubusercontent.com/adsasson3338/charity-data/main/charity_names.json',
                    dataType: 'json',
                    success: function(data) {
                    //    $('#charitySelect').select2({
                    //        data: data.map(function(value) {
                    //            return { id: value, text: value };
                     //       }),
                    //        placeholder: "-- Select a Charity --",
                    //        allowClear: true
                     //   });
$('#charitySelect').select2({
    data: data.map(function(value) {
        return { id: value, text: value };
    }),
    placeholder: "-- Select a Charity --",
    allowClear: true,
    matcher: function(params, data) {
        if ($.trim(params.term) === '') {
            return data;
        }

        const term = params.term.toLowerCase();
        const text = data.text.toLowerCase();

        // Check if all characters in the term appear in order in the text
        let index = 0;
        for (let i = 0; i < term.length; i++) {
            index = text.indexOf(term[i], index);
            if (index === -1) {
                return null;
            }
            index++;
        }

        return data;
    }
});

                    }
                });
            });
        </script>
                <div style="margin-top: 20px;">
            <br>

<script>
function printForm() {
    const date = new Date();
    const formattedDate = date.toLocaleDateString();
    const printWindow = window.open('', '', 'height=800,width=800');
    printWindow.document.write('<html><head><title>Print Form</title>');
    printWindow.document.write(`<style>
        body { font-family: Arial, sans-serif; padding: 30px; line-height: 1.6; font-size: 15pt; }
        h1, h2, h3 { margin-bottom: 10px; }
        hr { margin: 20px 0; }
        .section { margin-bottom: 20px; }
        .label { font-weight: bold; }
    </style>`);
    printWindow.document.write('</head><body>');
    printWindow.document.write('<center><h1>Donation Request Form</h1>');
    printWindow.document.write('<b><p>Sakar International Inc.</b><br>195 Carter Drive, Edison, NJ 08817</p></center>');
  

    printWindow.document.write('<p><strong>Date:</strong> ' + formattedDate + '</p>');

    <!-- printWindow.document.write('<div class="section"><center><h3>Donation Request</h3></center>'); -->
    const charity = document.getElementById("charitySelect");
const amountRaw = document.getElementById("amountRequested").value;

// Convert to number and format with commas and two decimal places
const amount = parseFloat(amountRaw.replace(/[^0-9.]/g, '')) || 0;
const formattedAmount = amount.toLocaleString('en-US', {
  minimumFractionDigits: 2,
  maximumFractionDigits: 2
});

printWindow.document.write('<br><p><strong>Vendor:</strong> ' + 
  (charity.options[charity.selectedIndex]?.text || 'N/A') + '</p>');
printWindow.document.write('<br><p><strong>Amount Requested:</strong> $' + 
  formattedAmount + '</p></div>');

    printWindow.document.write('<div class="section"><br><h3>From Account</h3>');
    const checkboxes = document.querySelectorAll('input[type="checkbox"]');
    checkboxes.forEach(cb => {
        const label = cb.nextSibling.textContent.trim();
        printWindow.document.write('<p>' + (cb.checked ? '[x] ' : '[ ] ') + label + '</p>');
    });
    printWindow.document.write('</div>');

    printWindow.document.write('<br><p><strong>Signed by:</strong> ____________________________</p>');
       printWindow.document.write('</body></html>');
    printWindow.document.close();
    printWindow.print();
}
</script>
